# Stage 1: imitate the Champion bot. Every seat at every table plays the Champion's moves; the network learns
# them (cross-entropy) and the value of the Champion's positions (lambda-returns of its own games).
name: bc
env:
  opponents: {self: 1.0}
  behavior: teacher
  teacher: champion
train:
  mode: bc
  total_steps: 4_000_000
  num_envs: 160
  num_steps: 64
  num_workers: 10
  lr: 1.0e-3
  lr_final: 5.0e-5
  epochs: 2
  minibatch: 1024
  vf_coef: 0.5
eval:
  every: 60
  games: 100
  at_start: false
  num_workers: 10
